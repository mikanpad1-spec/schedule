<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>氷晶ログ</title>
<style>
:root{--bg:#f4f8fd;--card:#fff;--tx:#1d2b45;--sub:#6b7a93;--line:#dbe4f0;--ac:#2f6fd0;--up:#1a9150;--dn:#d6453d;--sat:#2f6fd0;--sun:#d6453d;--sel:#e3eeff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1b2230;--tx:#e6ecf7;--sub:#93a0b8;--line:#2c3649;--ac:#6aa3ff;--up:#4cd08a;--dn:#ff7b73;--sat:#6aa3ff;--sun:#ff7b73;--sel:#26344d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161d;--card:#1b2230;--tx:#e6ecf7;--sub:#93a0b8;--line:#2c3649;--ac:#6aa3ff;--up:#4cd08a;--dn:#ff7b73;--sat:#6aa3ff;--sun:#ff7b73;--sel:#26344d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:14px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
input[type=number]{flex:1;font-size:18px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--line)}
.res{margin-top:10px;font-size:15px;min-height:22px}
.up{color:var(--up)}.dn{color:var(--dn)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--sub)}
.stats b{display:block;font-size:17px;color:var(--tx)}
.stats .inl b{display:inline;font-size:inherit}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.nav strong{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
.cell{min-height:58px;border:1px solid var(--line);border-radius:8px;padding:3px 2px;text-align:center;font-size:11px;background:var(--bg);cursor:pointer;overflow:hidden}
.cell.e{border:0;background:none;cursor:default}
.cell.sel{background:var(--sel);border-color:var(--ac)}
.cell .d{font-size:11px;color:var(--sub);text-align:left;padding-left:3px}
.cell .v{font-size:12px;font-weight:600;margin-top:2px}
.cell .df{font-size:11px;font-weight:700}
.cell.today .d{color:var(--ac);font-weight:700}
.sat .d{color:var(--sat)}.sun .d{color:var(--sun)}
.note{font-size:12px;color:var(--sub);margin-top:8px}
.gset{margin-top:6px;display:grid;gap:6px;font-size:12px;color:var(--sub)}
.gset .row{gap:6px}
.gset input{padding:5px;font-size:13px}
.gset input[type=number]{flex:none;width:96px}
.gset input[type=date]{flex:none}
.gset button{padding:5px 10px;font-size:12px}
.fld{display:grid;gap:4px;font-size:12px;color:var(--sub)}
.fld.grow{flex:1}
.fld input{width:100%}
input:focus{border-color:var(--ac)}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.pbar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ac);border-radius:999px}
#inputCard{scroll-margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>❄️ 氷晶ログ</h1>

<div class="card" id="inputCard">
<div class="row"><label class="fld"><span>日付</span><input type="date" id="date"></label><label class="fld grow"><span>現在の氷晶数</span><input type="number" id="val" inputmode="numeric" placeholder="例：57963"></label></div>
<label class="fld" style="margin-top:8px"><span>メモ（何に使った？）</span><input type="text" id="memo" maxlength="100" style="width:100%"></label>
<div class="row" style="margin-top:8px"><button id="save">記録する</button><button class="g" id="del">この日を削除</button></div>
<div class="res" id="res"></div>
<details style="margin-top:8px;font-size:12px;color:var(--sub)"><summary>目標を変更</summary>
<div class="gset">
<div class="row"><label for="goal">目標数</label><input type="number" id="goal" inputmode="numeric"></div>
<div class="row"><label for="gdate">期日</label><input type="date" id="gdate"><label for="gdays">または あと</label><input type="number" id="gdays" inputmode="numeric" min="1" placeholder="日数"><span>日</span></div>
<div class="row"><button id="gset">設定</button><button class="g" id="gclr">期日を消す</button></div>
</div></details>
<details style="margin-top:8px;font-size:12px;color:var(--sub)"><summary>データのバックアップ</summary>
<div class="row" style="margin-top:8px"><button class="g" id="exp" style="padding:6px 10px;font-size:12px">書き出し（JSON）</button><button class="g" id="impBtn" style="padding:6px 10px;font-size:12px">読み込み</button><input type="file" id="imp" accept="application/json,.json" hidden></div>
<div class="note">記録・メモ・目標をJSONファイルに保存／復元できます。復元すると今のデータに上書きされます。ブラウザのデータ消去に備えて、ときどき書き出しをおすすめします。</div></details>
</div>

<div class="card stats">
<div>最新の氷晶<b id="sLatest">-</b></div>
<div><span id="gLabel">目標まで</span><b id="sGoal">-</b></div>
<div style="grid-column:1/-1"><div class="pbar"><i id="pFill" style="width:0%"></i></div><div id="pTxt" style="font-size:12px;margin-top:4px"></div></div>
<div>今月の増減<b id="sMonth">-</b></div>
<div>貯蓄ペース(今月)<b id="sAvg">-</b></div>
<div id="sBreak" class="inl" style="grid-column:1/-1;font-size:12px"></div>
<div id="need" class="inl" style="grid-column:1/-1;font-size:12px"></div>
<div id="proj" class="inl" style="grid-column:1/-1;font-size:12px"></div>
</div>

<div class="card">
<div class="nav"><button class="g" id="prev">◀</button><strong id="title"></strong><span style="display:flex;gap:8px"><button class="g" id="todayBtn">今日</button><button class="g" id="next">▶</button></span></div>
<div class="grid" id="grid"></div>
<div class="note">日付をタップすると入力欄に呼び出せます。📝はメモのある日、🏁は目標の期日です。増減は直前の記録日との差です。データはこの端末のブラウザに保存されます。</div>
<div id="memos" style="margin-top:10px"></div>
</div>
<div class="card"><div class="row" style="justify-content:space-between"><strong>推移</strong><span style="display:flex;gap:6px"><button class="g" id="cr0" style="padding:4px 10px;font-size:12px">全部</button><button class="g" id="cr90" style="padding:4px 10px;font-size:12px">90日</button><button class="g" id="cr30" style="padding:4px 10px;font-size:12px">30日</button></span></div><div id="chart" style="margin-top:8px"></div>
</div>
</div>

<script>
var KEY="ice-log-v1",MKEY="ice-memo-v1",GKEY="ice-goal-v1",GDKEY="ice-goaldate-v1",GOAL=610000,GDATE="",data={},memo={};
try{data=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){data={}}
try{memo=JSON.parse(localStorage.getItem(MKEY)||"{}")}catch(e){memo={}}
try{var g0=parseInt(localStorage.getItem(GKEY),10);if(g0>0)GOAL=g0}catch(e){}
try{var gd0=localStorage.getItem(GDKEY);if(gd0&&/^\d{4}-\d\d-\d\d$/.test(gd0))GDATE=gd0}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(MKEY,JSON.stringify(memo))}catch(e){}}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var today=iso(new Date()),sel=today,view=new Date();view.setDate(1);
var chartRange=0;
var $=function(i){return document.getElementById(i)};
function fmt(n){return n.toLocaleString("ja-JP")}
function sg(n){return (n>0?"+":n<0?"−":"±")+fmt(Math.abs(n))}
function cls(n){return n>0?"up":n<0?"dn":""}
function md(k){return parseInt(k.slice(5,7),10)+"/"+parseInt(k.slice(8),10)}
function tm(k){return new Date(k+"T00:00:00").getTime()}
function daysLeft(){return GDATE?Math.round((tm(GDATE)-tm(today))/86400000):null}
function prevKey(k){var ks=Object.keys(data).filter(function(x){return x<k}).sort();return ks.length?ks[ks.length-1]:null}
function diff(k){var p=prevKey(k);return p===null?null:data[k]-data[p]}
function short(n){return Math.abs(n)>=10000?(n/10000).toFixed(2).replace(/\.?0+$/,"")+"万":fmt(n)}
function showRes(){
  var k=$("date").value;
  if(data[k]===undefined){$("res").innerHTML="";return}
  var d=diff(k),p=prevKey(k);
  $("res").innerHTML=d===null?"初回の記録です":"前回("+p.slice(5).replace("-","/")+")比 <b class='"+cls(d)+"'>"+sg(d)+"</b>";
}
function drawChart(){
  [0,90,30].forEach(function(r){var b=$("cr"+r);if(b){var on=chartRange===r;b.style.background=on?"var(--ac)":"";b.style.color=on?"#fff":""}});
  var all=Object.keys(data).sort(),el=$("chart");
  var ks=all;
  if(chartRange>0&&all.length){var lt=tm(all[all.length-1]);ks=all.filter(function(k){return lt-tm(k)<=chartRange*86400000})}
  if(ks.length<2){el.innerHTML="<div class='note'>"+(all.length<2?"2日分以上記録するとグラフが出ます":"この期間の記録が足りません。期間を広げてみてください")+"</div>";return}
  var W=320,H=170,L=34,R=8,T=12,B=20;
  var t0=new Date(ks[0]+"T00:00:00").getTime(),t1=new Date(ks[ks.length-1]+"T00:00:00").getTime(),span=Math.max(t1-t0,1);
  var vs=ks.map(function(k){return data[k]}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  if(GOAL>=mn&&GOAL<=mx*1.5)mx=Math.max(mx,GOAL);
  if(mx==mn){mx+=1;mn-=1}
  var pad=(mx-mn)*0.08;mn-=pad;mx+=pad;
  function X(k){return L+(new Date(k+"T00:00:00").getTime()-t0)/span*(W-L-R)}
  function Y(v){return T+(mx-v)/(mx-mn)*(H-T-B)}
  var pts=ks.map(function(k){return X(k).toFixed(1)+","+Y(data[k]).toFixed(1)}).join(" ");
  var s="<svg viewBox='0 0 "+W+" "+H+"' style='width:100%;height:auto'>";
  for(var gi=0;gi<=3;gi++){var gv=mn+(mx-mn)*gi/3,gy=Y(gv).toFixed(1);
    s+="<line x1='"+L+"' x2='"+(W-R)+"' y1='"+gy+"' y2='"+gy+"' style='stroke:var(--line)'/><text x='"+(L-3)+"' y='"+(+gy+3)+"' text-anchor='end' font-size='9' style='fill:var(--sub)'>"+short(Math.round(gv))+"</text>"}
  if(GOAL>=mn&&GOAL<=mx)s+="<line x1='"+L+"' x2='"+(W-R)+"' y1='"+Y(GOAL).toFixed(1)+"' y2='"+Y(GOAL).toFixed(1)+"' style='stroke:var(--up);stroke-dasharray:4 3'/><text x='"+(W-R)+"' y='"+(Y(GOAL)-3).toFixed(1)+"' text-anchor='end' font-size='9' style='fill:var(--up)'>目標 "+short(GOAL)+"</text>";
  var area="M"+X(ks[0]).toFixed(1)+","+(H-B)+" L"+pts.replace(/ /g," L")+" L"+X(ks[ks.length-1]).toFixed(1)+","+(H-B)+" Z";
  s+="<path d='"+area+"' style='fill:var(--ac);opacity:.12'/>";
  s+="<polyline points='"+pts+"' fill='none' stroke-width='2' style='stroke:var(--ac)'/>";
  ks.forEach(function(k){s+="<circle cx='"+X(k).toFixed(1)+"' cy='"+Y(data[k]).toFixed(1)+"' r='2.5' style='fill:var(--ac)'/>"});
  var lk=ks[ks.length-1];
  s+="<text x='"+L+"' y='"+(H-5)+"' font-size='9' style='fill:var(--sub)'>"+ks[0].slice(5).replace("-","/")+" "+short(data[ks[0]])+"</text><text x='"+(W-R)+"' y='"+(H-5)+"' text-anchor='end' font-size='9' style='fill:var(--sub)'>"+lk.slice(5).replace("-","/")+" "+short(data[lk])+"</text></svg>";
  el.innerHTML=s;
}
function calcRate(){
  var ks=Object.keys(data).sort();
  if(ks.length<2)return null;
  var last=ks[ks.length-1],lt=tm(last);
  var rec=ks.filter(function(k){return lt-tm(k)<=14*86400000});
  if(rec.length<2)rec=ks.slice(-2);
  var f=rec[0],days=(lt-tm(f))/86400000;
  if(days<=0)return null;
  var gain=0;
  for(var i=1;i<rec.length;i++){var df=data[rec[i]]-data[rec[i-1]];if(df>0)gain+=df}
  return {rate:gain/days,days:days,last:last,lt:lt};
}
function proj(){
  var ks=Object.keys(data).sort(),el=$("proj");
  var c=calcRate();
  if(!c){el.textContent="2日分以上記録すると到達見込みが出ます";return}
  var rem=GOAL-data[c.last];
  if(rem<=0){el.innerHTML="目標に到達済みです 🎉";return}
  var h="直近"+Math.round(c.days)+"日の貯蓄ペース <b class='"+cls(c.rate)+"'>"+sg(Math.round(c.rate))+"</b>/日 → ";
  if(c.rate<=0){el.innerHTML=h+"このままだと到達しません";return}
  var d=new Date(c.lt+Math.ceil(rem/c.rate)*86400000);
  el.innerHTML=h+"<b>"+(d.getMonth()+1)+"/"+d.getDate()+"</b> ごろ到達見込み";
}
function needRate(){
  var el=$("need"),dl=daysLeft(),ks=Object.keys(data).sort();
  if(dl===null){el.innerHTML="";return}
  if(!ks.length){el.innerHTML="期日 "+md(GDATE)+"(残り"+dl+"日)。氷晶数を記録すると必要ペースが出ます";return}
  var rem=GOAL-data[ks[ks.length-1]];
  if(rem<=0){el.innerHTML="";return}
  if(dl<0){el.innerHTML="期日("+md(GDATE)+")を過ぎています。残り "+fmt(rem);return}
  if(dl===0){el.innerHTML="今日が期日です。残り <b>"+fmt(rem)+"</b>";return}
  var nd=Math.ceil(rem/dl);
  var h="期日 "+md(GDATE)+" まで残り <b>"+dl+"日</b> → 1日 <b>+"+fmt(nd)+"</b> 必要";
  var c=calcRate();
  if(c){var gap=Math.round(c.rate)-nd;
    h+=gap>=0?"<br><span class='up'>今の貯蓄ペースで間に合います(1日 "+sg(gap)+" の余裕)</span>":"<br><span class='dn'>今の貯蓄ペースだと1日 "+fmt(-gap)+" 足りません</span>"}
  el.innerHTML=h;
}
function render(){
  var y=view.getFullYear(),m=view.getMonth();
  $("title").textContent=y+"年"+(m+1)+"月";
  var g=$("grid");g.innerHTML="";
  "日月火水木金土".split("").forEach(function(w,i){var e=document.createElement("div");e.className="dow";e.textContent=w;e.style.color=i==0?"var(--sun)":i==6?"var(--sat)":"";g.appendChild(e)});
  var first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  for(var i=0;i<first;i++){var e=document.createElement("div");e.className="cell e";g.appendChild(e)}
  var mSum=0,mCnt=0,mGain=0,mSpend=0,mDays=0;
  for(var d=1;d<=days;d++){
    var k=iso(new Date(y,m,d)),dow=new Date(y,m,d).getDay(),c=document.createElement("div");
    c.className="cell"+(k===sel?" sel":"")+(k===today?" today":"")+(dow==0?" sun":dow==6?" sat":"");
    var h="<div class='d'>"+d+"</div>";
    if(data[k]!==undefined){
      h+="<div class='v'>"+short(data[k])+"</div>";
      var df=diff(k);
      if(df!==null){h+="<div class='df "+cls(df)+"'>"+sg(df)+"</div>";mSum+=df;mCnt++;if(df>0)mGain+=df;else if(df<0)mSpend+=df;var pk2=prevKey(k);if(pk2)mDays+=(tm(k)-tm(pk2))/86400000}
    }
    if(memo[k])h+="<div>📝</div>";
    if(k===GDATE)h+="<div>🏁</div>";
    c.innerHTML=h;
    (function(kk){c.onclick=function(){sel=kk;$("date").value=kk;$("val").value=data[kk]!==undefined?data[kk]:"";$("memo").value=memo[kk]||"";showRes();render();var ic=$("inputCard");if(ic){var r=ic.getBoundingClientRect();if(r.bottom<0||r.top>window.innerHeight)ic.scrollIntoView({behavior:"smooth",block:"start"})}}})(k);
    g.appendChild(c);
  }
  $("sMonth").innerHTML=mCnt?"<span class='"+cls(mSum)+"'>"+sg(mSum)+"</span>":"-";
  $("sAvg").innerHTML=(mCnt&&mDays>0)?"<span class='"+cls(mGain/mDays)+"'>"+sg(Math.round(mGain/mDays))+"</span>":"-";
  var sb=$("sBreak");
  if(mCnt&&(mGain>0||mSpend<0)){var parts=[];if(mGain>0)parts.push("貯めた量 <b class='up'>"+sg(mGain)+"</b>");if(mSpend<0)parts.push("使った量 <b class='dn'>"+sg(mSpend)+"</b>");sb.innerHTML="今月の内訳："+parts.join(" / ")}else{sb.innerHTML=""}
  $("gLabel").textContent="目標("+short(GOAL)+")まで";drawChart();proj();needRate();
  var ml=$("memos");ml.innerHTML="";
  var pre=y+"-"+String(m+1).padStart(2,"0")+"-";
  Object.keys(memo).filter(function(x){return x.indexOf(pre)==0&&memo[x]}).sort().forEach(function(x){
    var r=document.createElement("div");r.style.cssText="font-size:13px;padding:6px 0;border-top:1px solid var(--line)";
    var df=data[x]!==undefined?diff(x):null;
    var t=document.createElement("span");t.style.color="var(--sub)";t.textContent=parseInt(x.slice(8),10)+"日 ";r.appendChild(t);
    if(df!==null){var s=document.createElement("b");s.className=cls(df);s.textContent=sg(df)+" ";r.appendChild(s)}
    r.appendChild(document.createTextNode(memo[x]));ml.appendChild(r)});
  if(!ml.children.length)ml.innerHTML="<div class='note'>この月のメモはまだありません</div>";
  var ks=Object.keys(data).sort();
  if(ks.length){var l=data[ks[ks.length-1]];$("sLatest").textContent=fmt(l);var r=GOAL-l;$("sGoal").textContent=r>0?"あと "+fmt(r):"達成 🎉"}
  else{$("sLatest").textContent="-";$("sGoal").textContent="-"}
  var pc=(ks.length&&GOAL>0)?Math.min(100,Math.round(l/GOAL*100)):0;
  $("pFill").style.width=pc+"%";
  $("pTxt").textContent=ks.length?("目標の "+pc+"% まで貯まっています"):"";
}
$("goal").value=GOAL;
function syncDays(){var dl=daysLeft();$("gdate").value=GDATE;$("gdays").value=dl!==null&&dl>0?dl:""}
syncDays();
$("gdays").oninput=function(){var n=parseInt($("gdays").value,10);if(n>0){var d=new Date();d.setDate(d.getDate()+n);$("gdate").value=iso(d)}else if($("gdays").value===""){$("gdate").value=""}};
$("gdate").onchange=function(){var v=$("gdate").value;if(v){var n=Math.round((tm(v)-tm(today))/86400000);$("gdays").value=n>0?n:""}else{$("gdays").value=""}};
$("gset").onclick=function(){
  var g=parseInt($("goal").value,10);
  if(g>0){GOAL=g;try{localStorage.setItem(GKEY,String(g))}catch(e){}}
  var v=$("gdate").value;
  if(/^\d{4}-\d\d-\d\d$/.test(v)){GDATE=v;try{localStorage.setItem(GDKEY,v)}catch(e){}}
  syncDays();render();
};
$("gclr").onclick=function(){GDATE="";try{localStorage.removeItem(GDKEY)}catch(e){}syncDays();render()};
$("date").value=today;
$("date").onchange=function(){sel=$("date").value;var k=sel;$("val").value=data[k]!==undefined?data[k]:"";$("memo").value=memo[k]||"";var dt=new Date(k+"T00:00:00");if(!isNaN(dt)){view=new Date(dt.getFullYear(),dt.getMonth(),1)}showRes();render()};
$("save").onclick=function(){
  var k=$("date").value,v=parseInt($("val").value,10);
  var mt=$("memo").value.trim();if(!k||(isNaN(v)&&!mt)){$("res").textContent="日付と、氷晶数かメモを入力してください";return}if(mt)memo[k]=mt;else delete memo[k];
  if(!isNaN(v))data[k]=v;save();sel=k;showRes();render();
};
$("del").onclick=function(){var k=$("date").value;if(data[k]!==undefined||memo[k]){if(!window.confirm(k+" の記録を削除しますか？"))return;delete data[k];delete memo[k];save();$("val").value="";$("memo").value="";showRes();render()}};
$("todayBtn").onclick=function(){view=new Date();view.setDate(1);render()};
$("exp").onclick=function(){
  var payload={app:"ice-log",version:1,data:data,memo:memo,goal:GOAL,gdate:GDATE};
  var blob=new Blob([JSON.stringify(payload,null,1)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ice-log-backup-"+today+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
};
$("impBtn").onclick=function(){$("imp").click()};
$("imp").onchange=function(){
  var f=this.files&&this.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var j=JSON.parse(rd.result),nd=j.data||j;
      if(!nd||typeof nd!=="object")throw new Error("bad");
      var clean={};Object.keys(nd).forEach(function(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&isFinite(+nd[k]))clean[k]=+nd[k]});
      if(!Object.keys(clean).length)throw new Error("empty");
      if(!window.confirm("バックアップを読み込みますか？今の記録は上書きされます。"))return;
      data=clean;
      if(j.memo&&typeof j.memo==="object")memo=j.memo;
      if(+j.goal>0){GOAL=+j.goal;try{localStorage.setItem(GKEY,String(GOAL))}catch(e){}}
      if(typeof j.gdate==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(j.gdate)){GDATE=j.gdate;try{localStorage.setItem(GDKEY,GDATE)}catch(e){}}
      save();$("goal").value=GOAL;syncDays();sel=today;$("date").value=today;$("val").value=data[today]!==undefined?data[today]:"";$("memo").value=memo[today]||"";showRes();render();
      $("res").textContent="バックアップを読み込みました";
    }catch(e){$("res").textContent="読み込みに失敗しました。JSONファイルを確認してください"}
  };
  rd.readAsText(f);this.value="";
};
$("prev").onclick=function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$("next").onclick=function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
if(data[today]!==undefined)$("val").value=data[today];
$("memo").value=memo[today]||"";
["cr0","cr90","cr30"].forEach(function(id){$(id).onclick=function(){chartRange=id==="cr0"?0:id==="cr90"?90:30;drawChart()}});
showRes();render();
</script>
</body>
